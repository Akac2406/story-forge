<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f0d17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Story Forge">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<title>Story Forge</title>
<style>
:root{--bg:#0f0d17;--card:#1c1930;--card2:#262142;--text:#e9e6f2;--muted:#9b94b5;--accent:#9b7bff;--accent2:#ff7ab8;--border:#2e2947;--dlg:#ffd98a;--grad:radial-gradient(1200px 600px at 50% -10%,#2a1f55 0%,#0f0d17 60%);--hdr:rgba(15,13,23,.7);--ub:linear-gradient(135deg,#3a2b73,#5b2d68);--ubb:#5a4a9a;--ubt:#cdbfff;--em:#c9c2e6;--onacc:#140f24;--bodyfont:Georgia,"Times New Roman",serif;--lh:1.75;--mx:16px;--fs:17px;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%}
body{margin:0;height:100%;background:var(--bg) var(--grad) fixed;color:var(--text);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
#app{height:100%;max-width:760px;margin:0 auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--hdr)}
header h1{flex:1;min-width:0;margin:0;font-size:18px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:15px;margin:22px 0 8px}
h3{font-size:14px;margin:18px 0 4px}
p{margin:8px 0}
.sub{color:var(--muted);font-size:13px}
button{font:inherit;font-size:14px;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:999px;padding:8px 14px;cursor:pointer}
button.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--onacc);border:0;font-weight:600}
button.big{width:100%;padding:13px;font-size:16px}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:8px 10px}
button.back{font-size:22px;line-height:1;padding:4px 10px}
button.pill{border-color:var(--accent);color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
input,textarea,select{width:100%;font:inherit;font-size:16px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:10px 12px}
textarea{resize:vertical}
option{background:var(--card);color:var(--text)}
.tabs{display:flex;gap:8px;padding:10px 16px}
.tabs button{flex:1}
.tabs button.on{border-color:var(--accent);color:var(--accent);background:var(--card2)}
@media(max-width:600px){.tabs{gap:4px;padding:8px 10px;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tabs button{min-width:0;padding:9px 4px;font-size:13px;white-space:nowrap}}
.page{flex:1;min-height:0;overflow-y:auto;padding:4px 16px 24px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:12px}
.card{display:flex;flex-direction:column;align-items:stretch;text-align:left;padding:0;border-radius:16px;overflow:hidden}
.card b{padding:10px 12px 0;font-size:14px}
.card small{padding:2px 12px 12px;color:var(--muted);font-size:12px}
.cover{height:92px;display:flex;align-items:center;justify-content:center;position:relative}
.cover span{font:700 28px Georgia,serif;color:rgba(255,255,255,.92);letter-spacing:2px}
.cover em,.hero em{position:absolute;left:8px;top:8px;font-style:normal;font-size:10px;text-transform:uppercase;letter-spacing:1px;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px}
.hero{position:relative;border-radius:18px;padding:44px 16px 16px;margin-top:12px;display:flex;flex-direction:column}
.hero b{font:700 24px Georgia,serif}
.hero small{opacity:.85}
.fld{display:block;margin:12px 0}
.fld>span{display:block;font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:12px}
.row.tight{flex-wrap:nowrap;margin-top:8px}
.row.tight>input,.row.tight>.memline,.row.tight>.sessbtn{flex:1;min-width:0}
.memline{font-size:14px}
.sessbtn{display:flex;flex-direction:column;text-align:left;border-radius:14px;gap:2px}
.sessbtn small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.notice{border:1px solid var(--accent);border-radius:14px;padding:12px;margin:12px 0;font-size:14px}
.item{border:1px solid var(--border);border-radius:14px;padding:10px;margin:8px 0;display:flex;flex-direction:column;gap:8px}
.duo{display:grid;grid-template-columns:1fr 1.6fr;gap:8px}
.tri{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--border)}
.chip.lock{opacity:.55}
.r-N{--rc:#9aa0b5}.r-R{--rc:#6cb6ff}.r-SR{--rc:#c08bff}.r-SSR{--rc:#ffd04a}
.chip[class*="r-"]{border-color:var(--rc);color:var(--rc)}
.stats{display:flex;gap:8px;padding:8px 16px;overflow-x:auto;border-bottom:1px solid var(--border)}
.stat{flex:0 0 auto;min-width:96px;font-size:12px;color:var(--muted)}
.stat b{color:var(--text);margin-left:6px}
.stat s{text-decoration:none;color:var(--accent2);margin-left:4px}
.stat i{display:block;height:4px;background:var(--border);border-radius:4px;margin-top:4px;overflow:hidden}
.stat u{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
#log{flex:1;min-height:0;overflow-y:auto;padding:16px var(--mx);display:flex;flex-direction:column;gap:14px}
.turn{max-width:100%;padding:12px 16px 14px;border-radius:18px;background:var(--card);border:1px solid var(--border);box-shadow:0 4px 18px rgba(0,0,0,.25)}
.turn.user{align-self:flex-end;max-width:90%;background:var(--ub);border-color:var(--ubb)}
.who{display:flex;justify-content:space-between;align-items:center;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-bottom:4px}
.turn.user .who{color:var(--ubt)}
.dots{padding:0 6px;border:0;background:transparent;color:inherit;font-size:18px;line-height:1}
.body{font-family:var(--bodyfont);font-size:var(--fs);line-height:var(--lh)}
.turn.user .body{font-style:italic}
.body p{margin:0 0 .85em;white-space:pre-wrap}.body p:last-child{margin:0}
.dlg{color:var(--dlg)}
.body em{color:var(--em)}
.hint{color:var(--muted);text-align:center;margin:auto;padding:20px;font-size:15px}
.ending,.endcard{border:1px solid var(--rc);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:4px;background:var(--card2)}
.ending small,.endcard small{color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-size:11px}
.ending b,.endcard b{color:var(--rc);font:700 20px Georgia,serif}
.endcard{margin-bottom:14px;align-items:center;text-align:center;padding:26px 14px}
.endcard em{font-style:normal;color:var(--rc);letter-spacing:3px}
footer{border-top:1px solid var(--border);padding:10px 16px;display:flex;flex-direction:column;gap:8px;background:var(--hdr)}
footer .row{margin:0}
.sugg{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px}
.sugg button{flex:0 0 auto;max-width:78%;white-space:normal;text-align:left;border-radius:14px;font-size:13px}
#input{min-height:48px;max-height:140px;resize:none;border-radius:16px}
.sheetbg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:5}
.sheet{width:100%;max-width:760px;max-height:88%;overflow-y:auto;background:var(--card);border-radius:20px 20px 0 0;border:1px solid var(--border);padding:8px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet input,.sheet textarea,.sheet select{background:var(--bg)}
.sheethead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-8px;background:var(--card);padding:8px 0}
.sheethead h2{margin:0;font-size:17px}
.menu{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.menu button,.modebtn{border-radius:14px;text-align:left;padding:12px 14px}
.modebtn{display:flex;flex-direction:column;width:100%;margin-top:8px}
.modebtn small{color:var(--muted);font-size:12px}
.modebtn.on{border-color:var(--accent)}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(0,0,0,.88);border:1px solid var(--border);color:var(--text);padding:10px 14px;border-radius:12px;font-size:14px;max-width:88%;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#toast.on{opacity:1}
.cta{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;border-radius:18px;padding:16px;margin-top:8px;border:0;color:var(--onacc);background:linear-gradient(135deg,var(--accent),var(--accent2))}
.cta b{font:700 19px Georgia,serif}
.cta small{font-size:13px;opacity:.85}
.age{flex:0 0 auto;font-size:12px;color:var(--muted);padding-right:12px;border-right:1px solid var(--border);max-width:150px}
.age b{display:block;color:var(--text);font-size:14px}
.skips{display:flex;gap:8px;overflow-x:auto}
.skips button{flex:0 0 auto;font-size:13px;padding:6px 12px}
.blog{font-size:14px;color:var(--muted);margin:12px 0;white-space:pre-wrap}
.chk{display:flex;align-items:center;gap:10px;font-size:14px;margin:12px 0}
.chk input{width:18px;height:18px;padding:0;flex:0 0 auto}
.tl{display:flex;gap:10px;margin:10px 0;font-size:14px}
.tl b{flex:0 0 62px;color:var(--accent)}
.ic{display:flex}
.turn.ai{background:transparent;border:0;box-shadow:none;padding:0 2px}
.askline{font:700 var(--fs)/1.5 var(--bodyfont);margin:-4px 2px 0}
.acts{display:flex;gap:10px;margin-top:-4px}
.acts button{width:38px;height:38px;padding:0;border-radius:50%;color:var(--muted);display:flex;align-items:center;justify-content:center}
.acts.old{margin-top:-12px}
.spend{margin-left:auto;align-self:center;font-size:12px;color:var(--muted)}
.acts.old button{width:28px;height:24px;border-color:transparent;background:transparent;opacity:.6}
.dots{display:flex;align-items:center}
.sgs{display:flex;flex-direction:column;gap:8px}
.sg{display:flex;align-items:stretch;gap:8px}
.sg .sgtext{flex:1;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:10px 12px;cursor:pointer;color:var(--muted)}
.sg .sgtext .body{font-size:15px;line-height:1.5}
.sg .sgtext .dlg{color:var(--text)}
.sg .sgside{flex:0 0 40px;border-radius:12px;padding:0;color:var(--muted);display:flex;align-items:center;justify-content:center}
.bar{display:flex;align-items:flex-end;gap:6px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:6px 6px 6px 12px}
.bar #input{flex:1;min-width:0;border:0;background:transparent;padding:8px 0;min-height:40px;border-radius:0;outline:none}
.bar button{flex:0 0 auto;width:38px;height:38px;padding:0;border-radius:50%;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:16px}
.bar button.on{border-color:var(--accent);color:var(--accent)}
.bar button.primary{border-radius:12px;color:var(--onacc)}
.bar button.txt{width:auto;padding:0 9px;border-radius:999px;font-size:11px;letter-spacing:.3px}
.drawerbg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:5;display:flex;justify-content:flex-end}
.drawer{width:88%;max-width:420px;height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--border);padding:calc(14px + env(safe-area-inset-top,0px)) 16px calc(24px + env(safe-area-inset-bottom,0px))}
.spent{text-align:right;font-size:13px;color:var(--muted)}
.dhead{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border-radius:16px;padding:12px;margin:10px 0 6px}
.dhead i{flex:0 0 48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font:700 15px Georgia,serif;color:#fff}
.dhead b{flex:1;min-width:0;font-size:16px}
.dhead .ic{color:var(--muted)}
.dsec{font-size:12px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);margin:18px 0 4px}
.drow{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:transparent;border:0;border-radius:12px;padding:13px 4px;font-size:16px;text-align:left}
.drow>span{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:13px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:55%}
.pills{display:flex;gap:8px;overflow-x:auto;margin:6px 0 12px}
.pills button{flex:0 0 auto}
.pills button.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.acc{border-bottom:1px solid var(--border);display:flex;flex-direction:column;gap:8px;padding-bottom:0}
.acc>button{display:flex;justify-content:space-between;gap:10px;width:100%;background:transparent;border:0;border-radius:0;padding:14px 2px;font-size:16px;text-align:left}
.acc>button span{color:var(--muted)}
.acc .row{margin:0 0 12px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{display:flex;flex-direction:column;align-items:flex-start;text-align:left;border-radius:14px;padding:12px;gap:2px}
.opt small{color:var(--muted);font-size:12px}
.opt.on{border-color:var(--accent);background:var(--card2)}
.prev{background:var(--bg);border-radius:14px;padding:12px 14px;margin-top:14px}
.prev h3{margin:12px 0 4px}.prev h3:first-child{margin-top:0}
.prev .body{font-size:15px;color:var(--muted)}
input[type=range]{padding:0;border:0;background:transparent;accent-color:var(--accent);height:30px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:-4px}
.av{display:flex;gap:8px;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:14px;padding:12px;margin:8px 0}
.av.on{border-color:var(--accent);background:var(--card2)}
.av .avmain{flex:1;min-width:0;background:transparent;border:0;padding:0;text-align:left;border-radius:0;display:flex;flex-direction:column;gap:4px;font-size:16px}
.av small{color:var(--muted);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.badge{align-self:flex-start;font-size:11px;background:var(--text);color:var(--bg);border-radius:6px;padding:1px 8px}
.mrow{display:flex;flex-direction:column;width:100%;text-align:left;border-radius:14px;padding:10px 12px;margin-top:8px;gap:2px}
.mrow small{color:var(--muted);font-size:12px;word-break:break-all}
.chead{display:flex;align-items:center;gap:8px;border-top:1px solid var(--border);padding-top:8px}
.chead:first-child{border-top:0;padding-top:0}
.chbtn{flex:1;min-width:0;display:flex;align-items:baseline;gap:6px;background:transparent;border:0;border-radius:8px;padding:6px 2px;text-align:left;font-size:15px}
.chbtn b{color:var(--accent);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.chbtn small{color:var(--muted);font-size:12px;margin-left:auto;flex:0 0 auto;padding-left:6px}
.cnote{align-self:flex-start;font-size:13px;border-color:var(--accent2);color:var(--accent2);border-radius:10px;padding:6px 10px;text-align:left}
.golim{font-size:12px;color:var(--muted);text-align:right;margin-top:-6px}
.golim.warn{color:#ffb35c}.golim.full{color:#ff6b7a}
.chsay{flex:0 0 auto;width:36px;height:36px;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--muted)}
#player{display:grid;gap:2px;background:var(--card2);border:1px solid var(--accent);border-radius:16px;padding:5px 8px}
.player-controls,.player-timeline{display:flex;align-items:center;gap:4px;min-width:0}
#player #pseek{flex:1;min-width:0;width:auto;height:24px;margin:0;accent-color:var(--accent);padding:0}
.player-timeline time,.player-timeline .player-total{flex:none;font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}
#player span{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#player .player-total{flex:none}
#player button{flex:0 0 auto;height:34px;min-width:34px;padding:0 9px;border-radius:999px;display:flex;align-items:center;justify-content:center;font-size:13px}
header h1[role=button]{cursor:pointer}
:root[data-theme=paper]{--bg:#f6efe2;--card:#fffaf0;--card2:#efe4cf;--text:#2b2419;--muted:#7c6f5c;--accent:#9b4d22;--accent2:#c7782b;--border:#e0d4bf;--dlg:#2f5d8a;--grad:none;--hdr:rgba(246,239,226,.92);--ub:#ead9bd;--ubb:#dcc7a3;--ubt:#7c5a2e;--em:#5d5040;--onacc:#fff;color-scheme:light}
:root[data-theme=ink]{--bg:#000;--card:#0d0d0d;--card2:#161616;--text:#e8e8e8;--muted:#8a8a8a;--accent:#5ad1c5;--accent2:#7fa8ff;--border:#1f1f1f;--dlg:#f2c879;--grad:none;--hdr:rgba(0,0,0,.85);--ub:#12201e;--ubb:#1f3a37;--ubt:#8fe3da;--em:#b9b9b9;--onacc:#001b18;color-scheme:dark}
:root[data-theme=moon]{--bg:#121822;--card:#1a2332;--card2:#233047;--text:#dfe7f2;--muted:#8fa0b8;--accent:#8fb8ff;--accent2:#b49cff;--border:#2a3547;--dlg:#f4d58d;--grad:linear-gradient(#1b2433,#121822);--hdr:rgba(18,24,34,.82);--ub:#26344d;--ubb:#36486a;--ubt:#b9d0ff;--em:#b7c4d8;--onacc:#0b1220;color-scheme:dark}
:root[data-theme=ember]{--bg:#1a0f0d;--card:#24150f;--card2:#301c14;--text:#f1e4dc;--muted:#a88f84;--accent:#ff7a45;--accent2:#ffb347;--border:#3a2420;--dlg:#ffd27a;--grad:radial-gradient(1200px 600px at 50% -10%,#3a1a10 0%,#1a0f0d 60%);--hdr:rgba(26,15,13,.82);--ub:#3b1d14;--ubb:#5a2c1c;--ubt:#ffb08c;--em:#d8c2b6;--onacc:#1a0f0d;color-scheme:dark}
:root[data-theme=sakura]{--bg:#fff5f8;--card:#fff;--card2:#fbe6ee;--text:#3a2630;--muted:#93707f;--accent:#d14d84;--accent2:#8a5bd6;--border:#f1d6e1;--dlg:#5b4bb0;--grad:none;--hdr:rgba(255,245,248,.92);--ub:#f8dbe7;--ubb:#efc3d6;--ubt:#a3416c;--em:#6e5361;--onacc:#fff;color-scheme:light}
.swatch{display:flex;gap:4px;margin-bottom:4px}.swatch i{width:16px;height:16px;border-radius:50%;border:1px solid rgba(128,128,128,.4)}
body.novel .turn.user{align-self:stretch;max-width:100%;background:transparent;border:0;border-left:2px solid var(--accent);border-radius:0;box-shadow:none;padding:2px 0 2px 10px}
body.novel .turn.user .who{float:right;margin:0}body.novel .turn.user .who span{display:none}
body.novel .turn.user .body{font-size:calc(var(--fs) - 2px);color:var(--muted)}
#prog{display:none;height:3px;background:var(--border);flex:0 0 auto}#prog u{display:block;height:100%;width:0;background:var(--accent)}
#bleft{display:none;text-align:center;font-size:12px;color:var(--muted);padding:4px 0 calc(6px + env(safe-area-inset-bottom,0px))}
#app.bookmode #prog,#app.bookmode #bleft{display:block}
#app.bookmode>header,#app.bookmode>.stats,#app.bookmode>.statsmini,#app.bookmode>footer{display:none}
#app.bookmode.ctl>header,#app.bookmode.ctl>.stats,#app.bookmode.ctl>footer{display:flex}#app.bookmode.ctl>.statsmini{display:block}#app.bookmode.ctl #bleft{display:none}
#app.bookmode #log{padding-top:22px}
#app.hidebar>header,#app.hidebar>.stats,#app.hidebar>.statsmini{display:none}
.statsmini{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--border);border-radius:0;background:transparent;color:var(--muted);font-size:12px;padding:8px 16px}
.statsmini b{color:var(--text);margin-right:8px}

function readerDiscovery(main, worlds){
  const recent=[];
  const seen=new Set();
  for(const session of DB.sessions.slice().sort((a,b)=>(b.updated||0)-(a.updated||0))){
    const story=getStory(session.storyId);
    if(!story||seen.has(story.id))continue;
    seen.add(story.id);
    recent.push({story,session});
  }
  const featured=DB.stories.filter(st=>st.kind!=="character"&&(st.cover||st.coverT||st.bannerT)).slice(0,8);
  if(!featured.length&&recent.length)featured.push(recent[0].story);
  if(!featured.length&&worlds.length)featured.push(worlds[0]);
  const catalog=[...DB.stories,...worlds];
  const browse=h("section",{class:"reader-browse"});
  const results=h("section",{class:"reader-search-results",hidden:true,"aria-label":"Search results"});
  const status=h("p",{class:"sub",role:"status"});
  const search=h("input",{type:"search",class:"reader-search-input",
    "aria-label":"Search stories",placeholder:"Search by title, genre or tag",
    oninput:()=>filter()});
  const tile=({story,session})=>
    h("button",{class:"reader-tile",onclick:()=>go(session?{n:"chat",id:session.id}:{n:"story",id:story.id})},
      readerCover(story),h("b",{text:story.title||story.charName||"Untitled"}));
  function filter(){
    const query=search.value.trim().toLocaleLowerCase();
    browse.hidden=!!query;
    results.hidden=!query;
    if(!query){status.textContent="";results.replaceChildren();return}
    const terms=query.split(/\s+/);
    const found=catalog.filter(story=>{
      const text=[story.title,story.charName,story.author,story.tag,story.style,story.canon,...(story.tags||[])]
        .filter(Boolean).join(" ").toLocaleLowerCase();
      return terms.every(term=>text.includes(term));
    });
    status.textContent=found.length?found.length+(found.length===1?" story found":" stories found"):"No matching stories.";
    results.replaceChildren(h("div",{class:"reader-result-grid"},...found.map(story=>tile({story}))));
  }
  if(featured.length){
    let selected=0;
    const panel=h("div",{class:"reader-feature-panel","aria-live":"polite"},readerFeature(featured[0],true));
    const counter=h("span",{class:"sub",text:"1 / "+featured.length});
    const navigate=offset=>{
      selected=(selected+offset+featured.length)%featured.length;
      panel.replaceChildren(readerFeature(featured[selected],true));
      counter.textContent=(selected+1)+" / "+featured.length;
    };
    ap(browse,panel);
    if(featured.length>1)ap(browse,h("nav",{class:"reader-feature-nav","aria-label":"Featured stories"},
      h("button",{text:"Previous",onclick:()=>navigate(-1)}),counter,
      h("button",{text:"Next",onclick:()=>navigate(1)})));

  ap(main,search,status,results,browse);

    ap(browse,h("h2",{text:label}),h("div",{class:"reader-shelf"},entries.map(tile)))};
  shelf("Continue playing",recent);
  shelf("My stories",DB.stories.map(story=>({story})));
  shelf("Explore worlds",worlds.map(story=>({story})));
  ap(browse,h("div",{class:"row reader-tools"},
    h("button",{class:"cta",text:"Build a world",onclick:()=>go({n:"build"})}),
    h("button",{text:"World Simulator",onclick:()=>go({n:"story",id:"lib:sim"})})));
}

// Your key is sent by your app with each request. It is never stored here.
// For extra safety, replace * with your app's address, e.g. "https://story-forge.netlify.app"
const ALLOWED_ORIGIN = "*";
const UPSTREAM = "https://opencode.ai/inference/go/openai/v1/chat/completions";

export default {
  async fetch(request, env) {
    const cors = {
      "Access-Control-Allow-Origin": ALLOWED_ORIGIN,
      "Access-Control-Allow-Methods": "GET, POST, PUT, OPTIONS",
      "Access-Control-Allow-Headers": "authorization, content-type, x-opencode-session, x-sync-id",
      "Access-Control-Max-Age": "86400",
    };

    const path = new URL(request.url).pathname;
    if (path === "/sync") {
      // Stores your encrypted Story Forge data so your devices stay in sync.
      // Needs a KV namespace bound to this Worker with the variable name SF.
      if (!env || !env.SF) return new Response("No KV namespace bound as SF", { status: 501, headers: cors });
      const id = request.headers.get("x-sync-id") || "";
      if (id.length < 32) return new Response("Bad sync id", { status: 400, headers: cors });
      if (request.method === "GET") {
        const v = await env.SF.get("sync:" + id);
        return new Response(v || "", { status: v ? 200 : 404, headers: { ...cors, "content-type": "text/plain" } });
      }
      if (request.method === "PUT") {
        const body = await request.text();
        if (body.length > 24000000) return new Response("Too large", { status: 413, headers: cors });
        await env.SF.put("sync:" + id, body);
        return new Response(null, { status: 204, headers: cors });
      }
    }
    if (request.method === "GET" && path === "/wiki") {
      // Fetches fan wiki pages for canon recall. Only wiki sites are allowed.
      const target = new URL(new URL(request.url).searchParams.get("u") || "https://x.invalid");
      if (!/(^|\\.)(fandom\\.com|wikipedia\\.org|wiki\\.gg|wikia\\.org|miraheze\\.org)$/i.test(target.hostname)) return new Response("Not allowed", { status: 403, headers: cors });

      return new Response(r.body, { status: r.status, headers: { ...cors, "content-type": r.headers.get("content-type") || "application/json" } });
    }
    if (request.method !== "POST" || path !== "/v1/chat/completions") {
      return new Response("Not found", { status: 404, headers: cors });
    }
    const auth = request.headers.get("authorization");
    if (!auth) return new Response("Missing key", { status: 401, headers: cors });
    const upstream = await fetch(UPSTREAM, {
      method: "POST",
      headers: {
        "authorization": auth,
        "content-type": "application/json",
        "user-agent": "StoryForge/13 (personal story app)",
        "x-opencode-session": request.headers.get("x-opencode-session") || "story-forge",
      },
      body: await request.text(),
    });

    for (const [k, v] of Object.entries(cors)) headers.set(k, v);
    return new Response(upstream.body, { status: upstream.status, headers });
  },
